# ==========================================
# Photo Watermark 水印设置
# 用记事本打开修改，改完保存即可
# ==========================================

[基础设置]
# 样式选择（可多选，用逗号分隔，按顺序叠加）
# strip       - 白底黑字条形边框，照片下方显示参数
# transparent - 半透明水印，叠加在照片上
# border      - 纯色边框包裹照片
# blur        - 模糊边框，效果自然好看
#
# 示例：
# 默认样式 = strip              # 单个样式
# 默认样式 = blur, transparent  # 先模糊边框，再叠加半透明水印
# 默认样式 = strip, border      # 先条形边框，再叠加纯色边框
默认样式 = strip

# 默认输入路径（留空则弹出窗口选择照片/文件夹，推荐）
# 设置路径（如 ./input）则直接处理该路径，不弹窗
默认输入路径 =

# 默认输出路径（留空则自动处理：单张/多张照片输出到照片所在目录，文件夹输出到其下watermark_output）
默认输出路径 =

# JPEG输出质量（1-100，98接近原图质量）
JPEG质量 = 98

# JPEG色度采样（0=4:4:4最清晰，1=4:2:2，2=4:2:0文件最小；摄影师建议0）
JPEG色度采样 = 0

# 是否显示控制台窗口（是=显示黑窗口，否=隐藏，处理完成/出错时用弹窗提示；仅exe生效）
显示控制台窗口 = 否

# 边框背景图（留空=纯色背景；填图片路径则用该图做水印边框背景，strip白条/纯色边框样式生效）
# 也可以在程序设置窗口里选择
边框背景图 =

# 边框背景图透明度（0-255，255=完全不透明，128=半透明，越小越透）
边框背景图透明度 = 128

# 处理完成后自动打开输出文件夹（是/否）
自动打开输出 = 是

# 自定义文字/签名（留空则不显示，默认无水印文字；命令行 --text 可覆盖）
# 示例：©我的签名  Photographer Name（留空=不显示）
自定义文字 =

# 手动指定品牌（留空=自动识别EXIF品牌；填 尼康/佳能/小米/华为/苹果 等则强制用该品牌Logo，
# 适合没有EXIF信息的照片，也可在设置窗口里选择）
默认品牌 =

# ==========================================
# 文字模板设置
# ==========================================
[文字模板]

# 第一行格式（白条边框左侧上方）
# 可用变量：{相机} {镜头} {焦距} {光圈} {快门} {ISO} {日期} {品牌} {文件夹}
第一行格式 = {相机}

# 第二行格式（白条边框左侧下方）
第二行格式 = {镜头}

# 右侧参数格式（白条边框右侧上方）
右侧参数格式 = {焦距} {光圈} {快门} {ISO}

# 右侧日期格式（白条边框右侧下方）
右侧日期格式 = {日期}

# 半透明水印格式（所有信息在一行）
半透明格式 = {相机} | {焦距} {光圈} {快门} {ISO}

# 纯色边框格式
边框格式 = {焦距} {光圈} {快门} {ISO} | {日期}

# 模糊边框格式
模糊格式 = {焦距} {光圈} {快门} {ISO}

# 模糊边框第二行格式
模糊第二行格式 = {日期}

# ==========================================
# 白条边框样式设置（strip）
# ==========================================
[白条边框]

# 边框高度占照片高度的比例（0.05=窄，0.10=宽）
边框高度 = 0.08

# 字体大小比例（数字越小字体越大）
字体大小 = 3

# 左侧边距比例
左侧边距 = 0.025

# 右侧边距比例
右侧边距 = 0.025

# 两行文字间距（像素）
文字间距 = 6

# 垂直对齐：上 / 中 / 下
垂直对齐 = 中

# ==========================================
# 字体设置
# ==========================================
[字体设置]

# 字体文件路径（留空使用系统默认微软雅黑）
# 示例：C:/Windows/Fonts/simhei.ttf
字体路径 =

# 字体大小比例（数字越小字体越大）
字体大小比例 = 3

# ==========================================
# 颜色设置
# ==========================================
[颜色设置]

# 白条边框背景色
白条背景 = 白色

# 白条边框相机型号颜色
白条相机颜色 = 30,30,30

# 白条边框镜头型号颜色
白条镜头颜色 = 120,120,120

# 白条边框参数颜色
白条参数颜色 = 30,30,30

# 白条边框日期颜色
白条日期颜色 = 100,100,100

# 模糊边框文字颜色
模糊文字颜色 = 白色

# 纯色边框颜色
边框颜色 = 黑色

# 纯色边框文字颜色
边框文字颜色 = 白色

# ==========================================
# 半透明水印样式设置（transparent）
# ==========================================
[半透明水印]

# 位置：左上 / 右上 / 左下 / 右下
位置 = 右下

# 透明度（50=很淡，128=适中，200=很清楚）
透明度 = 128

# 字体大小比例（相对于图片宽度，0.02=小，0.03=中，0.04=大）
字体大小 = 0.02

# ==========================================
# 纯色边框样式设置（border）
# ==========================================
[纯色边框]

# 边框颜色（黑色/白色/灰色 或 红,绿,蓝）
边框颜色 = 黑色

# 文字颜色
文字颜色 = 白色

# 左右边框宽度比例
边框宽度 = 0.04

# 底部边框宽度比例（比两侧更宽）
底部宽度 = 0.08

# ==========================================
# 模糊边框样式设置（blur）
# ==========================================
[模糊边框]

# 边框宽度比例（0.04=窄，0.10=宽）
边框宽度 = 0.06

# 模糊强度（10=轻微，20=适中，40=很模糊）
模糊强度 = 15

# 圆角大小（0=无圆角，0.05=小圆角，0.10=大圆角）
圆角大小 = 0.03

# 文字阴影（是/否）
文字阴影 = 是

# ==========================================
# 智能样式设置
# ==========================================
[智能样式]

# 启用智能样式选择（根据照片方向自动选择）
# 是 - 横版用白条、竖版用模糊边框、方形用半透明（推荐，竖版更好看）
# 否 - 所有照片都用上面设置的默认样式
启用智能样式 = 是

# 横版照片样式（宽>高）
横版样式 = strip

# 竖版照片样式（高>宽）
竖版样式 = blur

# 方形照片样式（宽≈高）
方形样式 = transparent
