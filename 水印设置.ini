# ==========================================
# Photo Watermark 水印设置
# 用记事本打开修改，改完保存即可
# ==========================================

[基础设置]
# 样式选择：strip / transparent / border / blur
# strip       - 白底黑字条形边框，照片下方显示参数
# transparent - 半透明水印，叠加在照片上
# border      - 纯色边框包裹照片
# blur        - 模糊边框，效果自然好看
默认样式 = strip

# 默认输入路径（留空则每次弹出选择对话框）
默认输入路径 = ./input

# 默认输出路径（留空则自动创建output文件夹）
默认输出路径 = ./output

# JPEG输出质量（1-100，98接近原图质量）
JPEG质量 = 98

# 处理完成后自动打开输出文件夹（是/否）
自动打开输出 = 是

# ==========================================
# 白条边框样式设置（strip）
# ==========================================
[白条边框]

# 边框高度占照片高度的比例（0.05=窄，0.10=宽）
边框高度 = 0.08

# 字体大小比例（数字越小字体越大）
字体大小 = 3

# 左侧边距比例
左侧边距 = 0.025

# 右侧边距比例
右侧边距 = 0.025

# 两行文字间距（像素）
文字间距 = 6

# ==========================================
# 半透明水印样式设置（transparent）
# ==========================================
[半透明水印]

# 位置：左上 / 右上 / 左下 / 右下
位置 = 右下

# 透明度（50=很淡，128=适中，200=很清楚）
透明度 = 128

# 字体大小比例（相对于图片宽度）
字体大小 = 0.03

# ==========================================
# 纯色边框样式设置（border）
# ==========================================
[纯色边框]

# 边框颜色（黑色/白色/灰色 或 红,绿,蓝）
边框颜色 = 黑色

# 文字颜色
文字颜色 = 白色

# 左右边框宽度比例
边框宽度 = 0.04

# 底部边框宽度比例（比两侧更宽）
底部宽度 = 0.08

# ==========================================
# 模糊边框样式设置（blur）
# ==========================================
[模糊边框]

# 边框宽度比例（0.04=窄，0.10=宽）
边框宽度 = 0.06

# 模糊强度（10=轻微，20=适中，40=很模糊）
模糊强度 = 15

# 圆角大小（0=无圆角，0.05=小圆角，0.10=大圆角）
圆角大小 = 0.03

# 文字阴影（是/否）
文字阴影 = 是

# ==========================================
# 智能样式设置
# ==========================================
[智能样式]

# 启用智能样式选择（根据照片方向自动选择样式）
# 是 - 根据照片方向自动选择
# 否 - 使用上面设置的默认样式
启用智能样式 = 否

# 横版照片样式（宽>高）
横版样式 = strip

# 竖版照片样式（高>宽）
竖版样式 = blur

# 方形照片样式（宽≈高）
方形样式 = transparent
