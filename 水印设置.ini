# ==========================================
# Photo Watermark 水印设置
# 用记事本打开修改，改完保存即可
# ==========================================

[基础设置]
# 样式选择（可多选，用逗号分隔，按顺序叠加）
# strip       - 白底黑字条形边框，照片下方显示参数
# transparent - 半透明水印，叠加在照片上
# border      - 纯色边框包裹照片
# blur        - 模糊边框，效果自然好看
# art         - 艺术字体：品牌艺术字+参数叠加照片底部（无边框，字体可自定义）
# wordmark    - 官方LOGO：品牌官方LOGO字标+机型+参数叠加照片底部（无边框）
# none        - 无水印(仅压缩)：不加水印，压缩/转换输出 JPG 到子文件夹
#
# 示例：
# 默认样式 = strip              # 单个样式
# 默认样式 = blur, transparent  # 先模糊边框，再叠加半透明水印
# 默认样式 = strip, border      # 先条形边框，再叠加纯色边框
默认样式 = strip

# 默认输入路径（留空则弹出窗口选择照片/文件夹，推荐）
# 设置路径（如 ./input）则直接处理该路径，不弹窗
默认输入路径 =

# 默认输出路径（留空则自动处理：单张/多张照片输出到照片所在目录，文件夹输出到其下watermark_output）
默认输出路径 =

# JPEG输出质量（1-100，98接近原图质量）
JPEG质量 = 98

# JPEG色度采样（0=4:4:4最清晰，1=4:2:2，2=4:2:0文件最小；摄影师建议0）
JPEG色度采样 = 0

# 是否显示控制台窗口（是=显示黑窗口，否=隐藏，处理完成/出错时用弹窗提示；仅exe生效）
显示控制台窗口 = 否

# 边框背景图（留空=纯色背景；填图片路径则用该图做水印边框背景，strip白条/纯色边框样式生效）
# 也可以在程序设置窗口里选择
边框背景图 =

# 边框背景图透明度（0-255，255=完全不透明，128=半透明，越小越透）
边框背景图透明度 = 128

# 调色模板（只作用于照片本体；边框/水印/Logo 不受影响）
# 取值：原图（不调色）/ 标准 / 视频感 / 清新 / 暖调 / 黑白 / 自定义模板名
# 「视频感」= 原 _lut/N-Log_to_Rec709_Standard.cube 的 look 移植（黑点按照片自适应）
调色模板 = 原图

# 调色强度（0-100，100=模板原强度，0=不调色）
调色强度 = 100

# 处理完成后自动打开输出文件夹（是/否；默认否，可在设置窗口勾选开启）
自动打开输出 = 否

# 自定义文字/签名（留空则不显示，默认无水印文字；命令行 --text 可覆盖）
# 示例：©我的签名  Photographer Name（留空=不显示）
自定义文字 =

# 手动指定品牌（留空=自动识别EXIF品牌；填 尼康/佳能/小米/华为/苹果 等则强制用该品牌Logo，
# 适合没有EXIF信息的照片，也可在设置窗口里选择）
默认品牌 =

# 默认预览照片（未选照片时，主窗口/设置窗口预览展示用的示例照片）
# 留空 = 自动用 input/ 文件夹里的第一张照片；支持相对程序目录的路径，如：input/demo_photo.jpg
默认预览照片 = input/demo_photo.jpg

# ==========================================
# 文字模板设置
# ==========================================
[文字模板]

# 第一行格式（白条边框左侧上方）
# 可用变量：{相机} {镜头} {焦距} {光圈} {快门} {ISO} {日期} {品牌} {文件夹}
第一行格式 = {相机}

# 第二行格式（白条边框左侧下方）
第二行格式 = {镜头}

# 右侧参数格式（白条边框右侧上方）
右侧参数格式 = {焦距} {光圈} {快门} {ISO}

# 右侧日期格式（白条边框右侧下方）
右侧日期格式 = {日期}

# 半透明水印格式（所有信息在一行）
半透明格式 = {相机} | {焦距} {光圈} {快门} {ISO}

# 纯色边框格式
边框格式 = {焦距} {光圈} {快门} {ISO} | {日期}

# 模糊边框格式
模糊格式 = {焦距} {光圈} {快门} {ISO}

# 模糊边框第二行格式
模糊第二行格式 = {日期}

# 艺术字体第一行格式（品牌大字，留空则用 品牌 → 自定义文字 兜底）
# 可用变量：{相机} {镜头} {焦距} {光圈} {快门} {ISO} {日期} {品牌} {文件夹}
艺术格式 = {相机}

# 艺术字体第二行格式（拍摄参数小字）
艺术参数格式 = {焦距} {光圈} {快门} {ISO}

# ==========================================
# 白条边框样式设置（strip）
# ==========================================
[白条边框]

# 边框高度占照片高度的比例（0.05=窄，0.10=宽）
边框高度 = 0.08

# Logo高度占边框高度的比例（0.50=小，0.70=默认，0.90=大；仅strip样式显示Logo）
Logo高度 = 0.7

# 字体大小比例（数字越小字体越大）
字体大小 = 3

# 左侧边距比例
左侧边距 = 0.025

# 右侧边距比例
右侧边距 = 0.025

# 两行文字间距（像素）
文字间距 = 6

# 垂直对齐：上 / 中 / 下
垂直对齐 = 中

# ==========================================
# 字体设置
# ==========================================
[字体设置]

# 字体文件路径（留空使用系统默认微软雅黑）
# 示例：C:/Windows/Fonts/simhei.ttf
字体路径 =

# 字体大小比例（数字越小字体越大）
字体大小比例 = 3

# ==========================================
# 艺术字体样式设置（art）
# ==========================================
[艺术字体]

# 品牌大字用的艺术字体文件路径（TTF/OTF/TTC）
# 留空 = 内置 Montserrat Italic（exe 已内嵌，SIL OFL 许可）
# 示例：C:/Windows/Fonts/georgiai.ttf 或 assets/fonts/我的字体.ttf
艺术字体路径 =

# 品牌大字大小（相对照片宽度的比例，0.020=小 0.028=默认 0.040=大）
字体大小 = 0.028

# 第二行参数字体大小（相对照片宽度的比例，0.0100=小 0.0150=默认 0.0200=大）
参数字体大小 = 0.015

# 文字颜色（白色/黑色/灰色 或 红,绿,蓝）
文字颜色 = 白色

# 柔和阴影（是/否，白字在亮背景上推荐开）
文字阴影 = 是

# ==========================================
# 官方LOGO字标样式设置（wordmark）
# ==========================================
[官方字标]

# 品牌LOGO字标高度（相对照片宽度的比例，0.030=小 0.040=默认 0.055=大）
# 机型文字（如 "Z7 2"）用艺术字体，与字标同高
字标大小 = 0.04

# 字标/文字颜色（白色/黑色/灰色 或 红,绿,蓝）
文字颜色 = 白色

# 柔和阴影（是/否，白字在亮背景上推荐开）
文字阴影 = 是

# 注：参数行大小共用 [艺术字体] 的 参数字体大小

# ==========================================
# 颜色设置
# ==========================================
[颜色设置]

# 白条边框背景色
白条背景 = 白色

# 白条边框相机型号颜色
白条相机颜色 = 30,30,30

# 白条边框镜头型号颜色
白条镜头颜色 = 120,120,120

# 白条边框参数颜色
白条参数颜色 = 30,30,30

# 白条边框日期颜色
白条日期颜色 = 100,100,100

# 模糊边框文字颜色
模糊文字颜色 = 白色

# 纯色边框颜色
边框颜色 = 黑色

# 纯色边框文字颜色
边框文字颜色 = 白色

# ==========================================
# 半透明水印样式设置（transparent）
# ==========================================
[半透明水印]

# 位置：左上 / 右上 / 左下 / 右下
位置 = 右下

# 透明度（50=很淡，128=适中，200=很清楚）
透明度 = 128

# 字体大小比例（相对于图片宽度，0.02=小，0.03=中，0.04=大）
字体大小 = 0.02

# ==========================================
# 纯色边框样式设置（border）
# ==========================================
[纯色边框]

# 边框颜色（黑色/白色/灰色 或 红,绿,蓝）
边框颜色 = 黑色

# 文字颜色
文字颜色 = 白色

# 左右边框宽度比例
边框宽度 = 0.04

# 底部边框宽度比例（比两侧更宽）
底部宽度 = 0.08

# ==========================================
# 模糊边框样式设置（blur）
# ==========================================
[模糊边框]

# 边框宽度比例（0.04=窄，0.10=宽）
边框宽度 = 0.06

# 模糊强度（10=轻微，20=适中，40=很模糊）
模糊强度 = 15

# 圆角大小（0=无圆角，0.05=小圆角，0.10=大圆角）
圆角大小 = 0.03

# 文字阴影（是/否）
文字阴影 = 是

# ==========================================
# 智能样式设置
# ==========================================
[智能样式]

# 启用智能样式选择（根据照片方向自动选择）
# 是 - 横版用白条、竖版用模糊边框、方形用半透明（推荐，竖版更好看）
# 否 - 所有照片都用上面设置的默认样式
启用智能样式 = 是

# 横版照片样式（宽>高）
横版样式 = strip

# 竖版照片样式（高>宽）
竖版样式 = blur

# 方形照片样式（宽≈高）
方形样式 = transparent

# ==========================================
# 调色模板（照片本体的简单调色；边框/水印不受影响）
# 每段 = 一个模板，改完保存即可；同名模板会覆盖程序内置值。
# 参数范围：曝光 -2..2 EV / 对比 0.5..1.5 / 高光 0..0.30 / 阴影 0..0.05
#           饱和 0..1.6 / 色温 -1..1 / 色调 -1..1 / 黑点 0..0.02 或 auto
# 黑点写 auto = 按照片暗部自动定（推荐；视频那条 look 的固定 0.012 会吃掉照片暗部）
# ==========================================
[调色模板:标准]
曝光 = 0.000
对比 = 1.100
高光 = 0.040
阴影 = 0.0000
饱和 = 1.080
色温 = 0.000
色调 = 0.000
黑点 = auto

[调色模板:视频感]
曝光 = -0.150
对比 = 1.000
高光 = 0.120
阴影 = 0.0000
饱和 = 1.300
色温 = 0.000
色调 = 0.000
黑点 = auto

[调色模板:清新]
曝光 = 0.150
对比 = 1.050
高光 = 0.020
阴影 = 0.0100
饱和 = 1.100
色温 = -0.300
色调 = 0.000
黑点 = auto

[调色模板:暖调]
曝光 = 0.050
对比 = 1.120
高光 = 0.060
阴影 = 0.0000
饱和 = 1.150
色温 = 0.350
色调 = 0.000
黑点 = auto

[调色模板:黑白]
曝光 = 0.000
对比 = 1.150
高光 = 0.030
阴影 = 0.0000
饱和 = 0.000
色温 = 0.000
色调 = 0.000
黑点 = 0.0000

# ==========================================
# 压缩/转换设置（无水印样式 none）
# ==========================================
[压缩设置]

# 最大边长（像素）：0=保持原尺寸不缩放；长边超过该值时等比缩小（只缩不放，
# 对所有样式生效）。常用：7680=8K，3840=4K，2560=2K
最大边长 = 0

# 目标体积（MB）：大于 0 时无水印输出自动调 JPEG 质量（30-95）使文件不超过该值；
# 压不到时按质量 30 输出并提示。0=关闭
目标体积MB = 0

# 无水印(仅压缩)输出的子文件夹名（在源图所在目录下创建，文件名保持原名，源图不动）
压缩输出子文件夹 = JPEG
